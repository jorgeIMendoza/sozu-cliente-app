name: Deploy Web a Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Lo dispara Codemagic al terminar de publicar a las tiendas, para que la web
  # se re-despliegue y herede el X.Y.Z recien tageado. Sin esto la web se queda
  # con el numero del release anterior hasta el siguiente merge a `main`.
  # `repository_dispatch` corre siempre sobre la rama por defecto (`main`), que
  # es justo lo que se quiere desplegar.
  repository_dispatch:
    types: [tiendas-publicadas]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo, por dos motivos:
          #   · El notify de PROD necesita HEAD^1 (tip anterior de main) para
          #     listar a TODOS los autores de PRs del release; depth 1 lo rompe.
          #   · Los tags son la fuente de verdad del versionName. Con un clon
          #     shallow, `fetch-tags` solo trae los tags que caen dentro de esa
          #     profundidad: los vX.Y.Z apuntan a commits más viejos, así que no
          #     llegaba ninguno y el paso "Resolver versionName desde tags"
          #     imprimía "Sin tags vX.Y.Z" y publicaba el piso del pubspec
          #     (1.0.0) mientras las tiendas ya iban en 1.0.3.
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Valores públicos por diseño (URL + anon key van embebidos en cualquier
      # app cliente). NUNCA poner aquí service_role ni credenciales de BD.
      - name: Crear assets/env
        run: |
          mkdir -p assets
          cat > assets/env <<EOF
          SUPABASE_URL=https://tzmhgfjmddkfyffkkmto.supabase.co
          SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6bWhnZmptZGRrZnlmZmtrbXRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTczNTU0NDUsImV4cCI6MjA3MjkzMTQ0NX0.8DaFtWO6zyJg14jFo_Zm2idYKwI-mvfmUtlixG2JDSE
          EOF

      # El X.Y.Z vive en los tags, no en pubspec.yaml: `main` está protegida y
      # el CI no puede commitear ahí, así que el pubspec del repo se queda en el
      # piso inicial (1.0.0) para siempre. Sin este paso el footer de la web
      # anunciaba 1.0.0 mientras las tiendas iban en 1.0.2.
      #
      # Aquí NO se sube el vigesimal ni se tagea: el contador lo mueve QUIEN
      # PUBLICA A LAS TIENDAS (`bump_release_version` en codemagic.yaml). La web
      # se despliega en cada merge a `main` y las tiendas una vez por semana; si
      # la web también bumpeara, se adelantaría sin parar y las tiendas nunca la
      # alcanzarían. El X.Y.Z identifica el RELEASE, y los builds web
      # intermedios se distinguen por el `-YYMMDD.HHMM` del mismo footer.
      #
      # Lo que faltaba no era que la web bumpeara, sino que se re-desplegara al
      # publicar a tiendas: eso lo cubre el trigger `repository_dispatch` de
      # arriba, que dispara Codemagic cuando el tag nuevo ya existe.
      - name: Resolver versionName desde tags
        run: |
          set -e
          git fetch --tags --force --quiet
          EN_HEAD=$(git tag --points-at HEAD --list 'v[0-9]*' --sort=v:refname | tail -1)
          ULTIMO=$(git tag --list 'v[0-9]*' --sort=v:refname | tail -1)
          NAME="${EN_HEAD:-$ULTIMO}"
          if [ -z "$NAME" ]; then
            echo "Sin tags vX.Y.Z: se queda el piso del pubspec."
          else
            bash tool/bump_version.sh --set "${NAME#v}" >/dev/null
            echo "Tag en HEAD: ${EN_HEAD:-ninguno} · último tag: ${ULTIMO:-ninguno} · se publica: ${NAME#v}"
          fi

      - name: Build web (versión con hora de México)
        run: |
          BUILD_TIMESTAMP=$(TZ=America/Mexico_City date +%y%m%d.%H%M)
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
          flutter build web --release --pwa-strategy=none --dart-define=BUILD_TIMESTAMP=$BUILD_TIMESTAMP --dart-define=APP_ENV=prod

      - name: Deploy a Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOZU_CLIENTE_PRD }}
          projectId: sozu-admin-prd
          channelId: live

      # --- Notificación WhatsApp (mismo sistema que sozu-admin) -------------
      # Requiere el secret FIREBASE_GCP_DEV (service account con lectura de
      # Firestore sozu-admin-dev, donde viven los teléfonos de contributors).
      #
      # Se salta en `repository_dispatch`: ese re-deploy no trae código nuevo,
      # solo re-sella el X.Y.Z que acaban de publicar las tiendas. El notify
      # lista los autores de los PRs entre HEAD^1 y HEAD, que ahí ya se
      # avisaron: volvería a mandarles el mismo WhatsApp.
      - name: Autenticar a Google Cloud (Firestore dev)
        if: always() && github.event_name != 'repository_dispatch'
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_GCP_DEV }}

      - name: Configurar gcloud (notify)
        if: always() && github.event_name != 'repository_dispatch'
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2

      - name: Notificar deploy listo (WhatsApp)
        if: always() && github.event_name != 'repository_dispatch'
        continue-on-error: true
        env:
          ENVIRONMENT: PROD
          STATUS: ${{ job.status }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIRESTORE_PROJECT: sozu-admin-dev
        run: bash ci/notify-deploy.sh
