<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- ═══════════════════════════════════════════════════════════════════════
       SEO Y TARJETAS AL COMPARTIR - lo único que se edita de este archivo.

       index.html NO se compila: `flutter build web` lo copia tal cual, así que
       tocar esto no recompila Dart, solo pide un deploy. Y tiene que vivir en
       el HTML: los rastreadores de WhatsApp, X y Meta no ejecutan JavaScript,
       así que un meta puesto en runtime no lo ve nadie.

       Al cambiar el host hay que tocar los 4 valores absolutos (canonical,
       og:url y las dos imágenes). La imagen es web/og-image.jpg: se
       reemplaza el archivo, respetando 1.91:1 (hoy 1200x630).
       ═══════════════════════════════════════════════════════════════════════ -->
  <title>SOZU • Portal del Cliente</title>
  <meta name="description"
    content="Portal del Cliente SOZU: consulta tus propiedades, pagos, estado de cuenta y documentos de tu inversión inmobiliaria.">
  <link rel="canonical" href="https://clientes.sozu.com/">

  <!-- El portal vive detrás del login: nada que indexar y sí cuentas que
       proteger. Las tarjetas de abajo funcionan igual: esos rastreadores no
       obedecen robots. -->
  <meta name="robots" content="noindex, nofollow">

  <!-- WhatsApp, Meta, LinkedIn, Slack -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SOZU">
  <meta property="og:locale" content="es_MX">
  <meta property="og:title" content="SOZU • Portal del Cliente">
  <meta property="og:description"
    content="Consulta tus propiedades, pagos, estado de cuenta y documentos de tu inversión inmobiliaria.">
  <meta property="og:url" content="https://clientes.sozu.com/">
  <meta property="og:image" content="https://clientes.sozu.com/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:alt" content="Pantalla de acceso al Portal del Cliente SOZU">

  <!-- X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SOZU • Portal del Cliente">
  <meta name="twitter:description"
    content="Consulta tus propiedades, pagos, estado de cuenta y documentos de tu inversión inmobiliaria.">
  <meta name="twitter:image" content="https://clientes.sozu.com/og-image.jpg">

  <meta name="theme-color" content="#239F71">
  <!-- ══════════════════════ fin del bloque editable ══════════════════════ -->

  <!--
    OBLIGATORIO, no adorno. Sin esta línea Safari en iOS asume un viewport de
    980 px y escala la página: los toques y el <input> oculto que Flutter usa
    para escribir quedan desalineados, y el campo de contraseña se ve pero no
    recibe texto. Además la app se cree tablet y ramifica por el breakpoint
    equivocado.

    Sin `user-scalable=no` a propósito: iOS lo ignora desde hace años y en
    Android sí bloquearía el pinch-zoom, que es un requisito de accesibilidad.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SOZU">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">

  <!-- Un solo favicon: el icono de "SOZU Clientes" trae fondo claro propio, así
       que se lee igual en pestaña clara y oscura. Ya no hace falta el par
       claro/oscuro que necesitaba el pin transparente. -->
  <link rel="icon" type="image/png" href="favicon-clientes.png">

  <link rel="manifest" href="manifest.json">

  <!-- pdf.js: requerido por pdfx para renderizar PDFs en web (visor in-app) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!--
    Anti-caché: la app se compila SIN service worker (--pwa-strategy=none) para
    que los usuarios reciban SIEMPRE la última versión tras cada deploy (junto
    con los headers Cache-Control de firebase.json). Este script desregistra
    cualquier service worker viejo que haya quedado de builds anteriores (que
    servía el bundle cacheado y bloqueaba las actualizaciones).
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(function (regs) { for (var i = 0; i < regs.length; i++) { regs[i].unregister(); } })
        .catch(function () {});
    }
  </script>
</head>

<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
